[project]
name = "amp-hemopi2-environment"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "hemopi2==1.3",
  "torch==2.5.1+cpu",
  "scikit-learn==1.3.1",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "transformers==4.44.2",
]

[tool.uv]
constraint-dependencies = [
  "certifi==2026.7.22",
  "charset-normalizer==3.5.1",
  "cloudpickle==3.1.2",
  "filelock==3.32.3",
  "fsspec==2026.7.0",
  "hemopi2==1.3",
  "hf-xet==1.6.0",
  "huggingface-hub==0.36.2",
  "idna==3.20",
  "jinja2==3.1.6",
  "joblib==1.6.0",
  "markupsafe==3.0.3",
  "mpmath==1.3.0",
  "networkx==3.6.1",
  "numpy==1.26.4",
  "packaging==26.3",
  "pandas==2.2.3",
  "python-dateutil==2.9.0.post0",
  "pytz==2026.4",
  "pyyaml==6.0.3",
  "regex==2026.9.10",
  "requests==2.34.2",
  "safetensors==0.8.0",
  "scikit-learn==1.3.1",
  "scipy==1.17.1",
  "six==1.17.0",
  "sympy==1.13.1",
  "threadpoolctl==3.7.0",
  "tokenizers==0.19.1",
  "torch==2.5.1+cpu",
  "tqdm==4.70.1",
  "transformers==4.44.2",
  "typing-extensions==4.16.0",
  "tzdata==2026.4",
  "urllib3==2.8.0"
]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
