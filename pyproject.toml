[project]
name = "amp-submission"
version = "0.1.0"
description = "PLUM generation and multi-stage selection for AMP Challenge 2027"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy==2.1.3",
  "pandas==2.2.3",
  "torch==2.11.0+cu128",
  "biopython==1.88",
  "levenshtein==0.27.5",
  "seqme[aa-descriptors]==0.5.1",
  "scikit-learn==1.5.2",
  "fair-esm==2.0.0",
  "gdown==5.2.0",
  "transformers==5.16.1",
]

[project.scripts]
generate = "amp_submission.generate:main"
check-files = "amp_submission.check_files:main"

[build-system]
requires = ["uv_build==0.9.18"]
build-backend = "uv_build"

